name: CI

# Every pull request runs both layers: no path filters, so no required check is ever left pending. On main (after a
# merge) the same checks run again, then the images are published
on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

# A new push to the same PR cancels the run still going; on main a run is never cancelled mid-publish
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    api:
        name: API lint, build and tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: api
        steps:
            - name: Check out the code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Reads the pnpm version from `packageManager` in the root package.json
            - name: Set up pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm

            # The API and what it depends on (shared/) only; also generates the Prisma client
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter MealPlan-API...

            - name: Lint
              run: pnpm lint

            - name: Build
              id: build
              run: pnpm build

            # Fails under 80% on the domain and application layers (thresholds in vitest.config.mts)
            - name: Unit tests with coverage
              run: pnpm test:cov

            # Throwaway PostgreSQL in Docker (Testcontainers), available on GitHub's Ubuntu runners. Once the build passed,
            # each test step runs even when an earlier one failed, so a red run shows every failing test (the job stays red)
            - name: Integration tests
              if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: pnpm test:int

            # NestJS's `test:e2e`: HTTP requests on the booted API (integration in the course's sense); the end-to-end
            # tests through the UI are the e2e job below
            - name: HTTP and contract tests
              if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: pnpm test:e2e
              env:
                  # These tests boot the whole API, whose Gemini adapter needs a key at startup; no test calls Gemini
                  GEMINI_API_KEY: not-used-in-tests

    client:
        name: Client lint, build and tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client
        steps:
            - name: Check out the code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Reads the pnpm version from `packageManager` in the root package.json
            - name: Set up pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm

            # The client and what it depends on (shared/) only
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter mealplan-ui...

            - name: Lint
              run: pnpm lint

            - name: Build
              id: build
              run: pnpm build

            # Fails under 80% (coverageThresholds in angular.json)
            - name: Unit tests with coverage
              run: pnpm test:cov

            # The data-access services against the Prism mock of contracts/openapi.yaml, started by the tests themselves
            - name: Integration tests (Prism mock)
              if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: pnpm test:int

    # The user journeys in a real browser (Playwright, the runner's Chrome) on the built API, the client and a throwaway
    # database; e2e/playwright.config.ts starts both servers
    e2e:
        name: End-to-end tests
        needs: [api, client]
        runs-on: ubuntu-latest
        services:
            db:
                image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
                env:
                    POSTGRES_USER: mealplan
                    POSTGRES_PASSWORD: e2e-only
                    POSTGRES_DB: mealplan_e2e
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U mealplan"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            # Throwaway database of this job only: the password protects nothing
            DATABASE_URL: postgresql://mealplan:e2e-only@localhost:5432/mealplan_e2e
        steps:
            - name: Check out the code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter mealplan-e2e --filter MealPlan-API... --filter mealplan-ui...

            - name: End-to-end tests
              run: pnpm --filter mealplan-e2e test

            # Each failed test's trace (screenshots, network, console): open it with `pnpm exec playwright show-report`
            - name: Upload the Playwright report
              if: ${{ failure() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: e2e/playwright-report/
                  retention-days: 7

    # Delivery: the images are built on every pull request (a broken Dockerfile fails it) and published to the GitHub
    # Container Registry only on main, once every test job is green
    images:
        name: Docker images
        needs: [api, client, e2e]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        env:
            REGISTRY: ghcr.io/${{ github.repository_owner }}
            # Links each published package to this repository on GitHub
            SOURCE_LABEL: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        steps:
            - name: Check out the code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Built from the repository root (see each Dockerfile); api and migrate share their dependency stage
            - name: Build the images
              run: |
                  docker build -f api/Dockerfile --label "$SOURCE_LABEL" -t "$REGISTRY/mealplan-monorepo-api:$GITHUB_SHA" .
                  docker build -f api/Dockerfile --target migrate --label "$SOURCE_LABEL" -t "$REGISTRY/mealplan-monorepo-migrate:$GITHUB_SHA" .
                  docker build -f client/Dockerfile --label "$SOURCE_LABEL" -t "$REGISTRY/mealplan-monorepo-client:$GITHUB_SHA" .

            - name: Log in to the GitHub Container Registry
              if: github.event_name == 'push'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Each image twice: the commit's SHA (a fixed version) and latest (the last green main)
            - name: Publish the images
              if: github.event_name == 'push'
              run: |
                  for image in api migrate client; do
                      name="$REGISTRY/mealplan-monorepo-$image"
                      docker tag "$name:$GITHUB_SHA" "$name:latest"
                      docker push "$name:$GITHUB_SHA"
                      docker push "$name:latest"
                  done

    # The one check the main ruleset needs: always runs, red if any job before it failed, was cancelled or skipped
    ci-passed:
        name: CI passed
        if: always()
        needs: [api, client, e2e, images]
        runs-on: ubuntu-latest
        steps:
            - name: Check every job succeeded
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  echo "Job results: $RESULTS"
                  for result in $RESULTS; do
                      [ "$result" = success ] || exit 1
                  done
