name: CI client

# Only when the client, or something it builds on, changes
on:
    pull_request:
        paths:
            - 'client/**'
            - 'shared/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.github/workflows/ci-client.yml'

permissions:
    contents: read

# A new push to the same PR cancels the run still going
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Client lint, build and tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client
        steps:
            - name: Check out the code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Reads the pnpm version from `packageManager` in the root package.json
            - name: Set up pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm

            # The client and what it depends on (shared/) only
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter mealplan-ui...

            - name: Lint
              run: pnpm lint

            - name: Build
              run: pnpm build

            - name: Unit tests
              run: pnpm test --watch=false
