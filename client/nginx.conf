server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Static files only: in production the server's reverse proxy routes /api to the API before reaching this container

    # SPA routing: unknown paths fall back to index.html so Angular handles the route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
