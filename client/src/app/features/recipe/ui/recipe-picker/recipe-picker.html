<div #scroller class="min-h-0 flex-1 overflow-y-auto">
  @if (recipes(); as recipes) {
    <ul class="flex flex-col gap-1">
      @for (recipe of recipes; track recipe.id) {
        <li>
          <button
            type="button"
            class="btn btn-ghost h-auto min-h-11 w-full justify-start py-2 text-left font-medium"
            (click)="picked.emit(recipe)"
          >
            <app-icon [name]="icons[recipe.category]" size="1.2rem" class="shrink-0 text-primary" />
            <span class="min-w-0 break-words">{{ recipe.title }}</span>
          </button>
        </li>
      } @empty {
        <li>
          <app-empty-state message="Aucune recette dans le carnet pour l'instant">
            <a routerLink="/recipes" class="btn btn-primary">Aller au carnet</a>
          </app-empty-state>
        </li>
      }
    </ul>
  } @else if (!pageResource.error()) {
    <div class="flex flex-col gap-2">
      @for (i of [1, 2, 3, 4, 5]; track i) {
        <div class="skeleton h-11 w-full"></div>
      }
    </div>
  }

  @if (pageResource.error(); as error) {
    <app-error-state [error]="error" (retry)="pageResource.reload()" />
  } @else if (recipes() && pageResource.isLoading()) {
    <progress class="progress mt-2 w-full" aria-label="Chargement des recettes"></progress>
  }

  <div #scrollTrigger class="h-1 w-full"></div>
</div>
